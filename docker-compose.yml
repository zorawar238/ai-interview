services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devinterview-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    depends_on:
      - ollama
    networks:
      - devinterview-network

  ollama:
    image: ollama/ollama:latest
    container_name: devinterview-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - devinterview-network

networks:
  devinterview-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
